name: Release DMG

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签，必须与两个 Info.plist 和 CHANGELOG 一致，例如 v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      # Keep the successful build's exact artifact when only publish is re-run.
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and release notes
        id: metadata
        run: python3 Scripts/prepare-release.py check "$RELEASE_TAG"

      - name: Build application and Finder extension
        run: bash Scripts/build.sh

      - name: Run regression tests
        run: bash Scripts/test.sh

      - name: Package DMG
        run: bash Scripts/package-dmg.sh

      - name: Prepare release assets
        run: python3 Scripts/prepare-release.py stage "$RELEASE_TAG"

      - name: Upload checked release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      RELEASE_COMMIT: ${{ github.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate build artifact reference
        id: validate_artifact
        shell: bash
        run: |
          set -euo pipefail
          # An empty artifact-ids input would download all artifacts in the run.
          if [[ ! "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::构建产物 ID 缺失或无效，请重跑全部任务以重新构建安装包。'
            exit 1
          fi

      - name: Download checked release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ env.RELEASE_ARTIFACT_ID }}
          merge-multiple: true
          digest-mismatch: error
          path: release

      - name: Verify download integrity
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish release without replacing an existing version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG 已存在；不会覆盖安装包，请发布新版本。"
            exit 1
          fi

          # --target only applies to new tags. Check existing tags explicitly.
          object="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" \
            --jq '.[] | select(.ref == "refs/tags/" + env.RELEASE_TAG) | .object')"
          if [[ -n "$object" ]]; then
            for attempt in 1 2 3 4 5; do
              type="$(jq -r '.type' <<< "$object")"
              sha="$(jq -r '.sha' <<< "$object")"
              if [[ "$type" == commit ]]; then break; fi
              if [[ "$type" != tag ]]; then
                echo '::error::版本标签没有指向提交。'; exit 1
              fi
              object="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object')"
            done
            if [[ "$(jq -r '.type' <<< "$object")" != commit ||
                  "$(jq -r '.sha' <<< "$object")" != "$RELEASE_COMMIT" ]]; then
              echo '::error::版本标签与本次构建提交不一致。'; exit 1
            fi
          fi

          extra=(--target "$RELEASE_COMMIT")
          if [[ "$RELEASE_EVENT" == push ]]; then extra+=(--verify-tag); fi
          gh release create "$RELEASE_TAG" release/*.dmg release/SHA256SUMS.txt \
            "${extra[@]}" \
            --title "$RELEASE_TAG" \
            --notes-file release/release-notes.md --latest=true
